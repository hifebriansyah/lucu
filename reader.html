<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembaca Buku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=Orbitron:wght@600;900&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link rel="stylesheet" href="assets/reader.css">
</head>
<body>
  <nav class="bar">
    <a class="btn ghost" href="index.html"><i data-lucide="library" class="icon"></i><span class="hide-sm">Rak</span></a>
    <select id="toc" aria-label="Lompat ke cerita"></select>
    <div class="pager">
      <button class="pg-btn" id="prevSec" type="button" title="Bagian sebelumnya" aria-label="Bagian sebelumnya"><i data-lucide="chevrons-left" class="icon"></i></button>
      <button class="pg-btn" id="prevPage" type="button" title="Halaman sebelumnya" aria-label="Halaman sebelumnya"><i data-lucide="chevron-left" class="icon"></i></button>
      <span id="folio" class="folio"></span>
      <button class="pg-btn" id="nextPage" type="button" title="Halaman berikutnya" aria-label="Halaman berikutnya"><i data-lucide="chevron-right" class="icon"></i></button>
      <button class="pg-btn" id="nextSec" type="button" title="Bagian berikutnya" aria-label="Bagian berikutnya"><i data-lucide="chevrons-right" class="icon"></i></button>
    </div>
    <button class="btn ghost" id="bwBtn" type="button" aria-pressed="false" title="Lihat gambar hitam putih"><i data-lucide="contrast" class="icon"></i><span class="hide-sm">Hitam putih</span></button>
    <div class="paper-pick">
      <button class="btn ghost" id="paperBtn" type="button" aria-expanded="false" aria-controls="paperPanel" title="Warna kertas dan bingkai gambar"><span class="swatch" id="paperDot"></span><span class="hide-sm">Kertas</span></button>
      <div class="paper-panel" id="paperPanel" hidden>
        <div class="paper-title">Warna kertas</div>
        <div class="paper-swatches" id="paperSwatches"></div>
        <label class="paper-custom"><i data-lucide="palette" class="icon"></i>Warna lain <input type="color" id="paperInput"></label>
        <div class="paper-title">Bingkai gambar</div>
        <div class="paper-swatches" id="borderSwatches"></div>
        <label class="paper-custom"><i data-lucide="palette" class="icon"></i>Warna lain <input type="color" id="borderInput"></label>
        <div class="paper-title">Bentuk gambar bagian</div>
        <div class="paper-swatches" id="frameButtons"></div>
        <div class="paper-actions">
          <button class="btn ghost" id="paperReset" type="button"><i data-lucide="rotate-ccw" class="icon"></i>Default</button>
          <button class="btn" id="paperSave" type="button"><i data-lucide="check" class="icon"></i>Simpan</button>
        </div>
        <p class="paper-note">Dipakai juga di PDF.</p>
      </div>
    </div>
    <button class="btn ghost" id="coverBtn" type="button" title="Simpan sampul dengan judulnya (PNG, A5 300 dpi)"><i data-lucide="image-down" class="icon"></i><span class="hide-sm">Sampul</span></button>
    <a class="btn" id="printLink" href="#"><i data-lucide="printer" class="icon"></i><span class="hide-sm">PDF</span></a>
  </nav>
  <div class="stage" id="stage">
    <button class="turn prev" id="prev" aria-label="Halaman sebelumnya"><i data-lucide="chevron-left"></i></button>
    <div class="book-frame" id="frame">
      <div class="book" id="book">
        <div class="slot left" id="left"></div>
        <div class="slot right" id="right"></div>
      </div>
    </div>
    <button class="turn next" id="next" aria-label="Halaman berikutnya"><i data-lucide="chevron-right"></i></button>
  </div>
  <div class="loading" id="loading">Menata halaman…</div>
  <div class="measure" id="measure" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="assets/reader.js"></script>
</body>
</html>
