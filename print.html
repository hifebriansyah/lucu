<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Siap Cetak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=Orbitron:wght@600;900&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link rel="stylesheet" href="assets/print.css">
  <style>
    /* Screen-only chrome around the page preview. */
    @media screen {
      body { margin: 0; background: #5b564d; font-family: "Inter", system-ui, sans-serif; }
      .toolbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        padding: 10px 16px; background: #2c2924; color: #f6f1e7; font-size: 14px;
      }
      .toolbar a, .toolbar button, .toolbar select, .toolbar label {
        font: 600 14px "Inter", sans-serif; color: inherit;
      }
      .toolbar a, .toolbar button {
        display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        border: 0; border-radius: 999px; padding: 9px 15px; background: #b5532f; cursor: pointer;
      }
      .toolbar .ghost { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
      .toolbar select { background: #3a362f; border: 0; border-radius: 8px; padding: 8px; }
      .toolbar .info { opacity: .75; font-weight: 500; margin-left: auto; }
      .toolbar button:disabled { opacity: .4; cursor: default; }
      .toolbar svg { width: 18px; height: 18px; }
      .tip { padding: 8px 16px; background: #3a362f; color: #e9e1d2; font-size: 13px; }
    }
    @media print {
      .toolbar, .tip { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="ghost" href="index.html"><i data-lucide="library"></i>Rak</a>
    <a class="ghost" id="readLink" href="#"><i data-lucide="book-open"></i>Baca</a>
    <button class="ghost" id="bwBtn" type="button" aria-pressed="false" title="Cetak halaman dalam hitam putih (sampul tetap berwarna)"><i data-lucide="contrast"></i>Hitam putih</button>
    <button class="ghost" id="docxBtn" type="button" disabled title="Unduh naskah sebagai Word (.docx), A5, tanpa gambar"><i data-lucide="file-text"></i><span>Word</span></button>
    <button id="printBtn" disabled><i data-lucide="printer"></i>Cetak / Simpan PDF</button>
    <span class="info" id="info">Menata halaman…</span>
  </div>
  <div class="tip">Halamannya sama persis dengan yang tampil di Baca. Di jendela cetak, pilih <b>Simpan sebagai PDF</b>, biarkan ukuran kertas default, margin <b>Tidak ada</b>, dan matikan <b>Header dan footer</b>. Sampul dicetak terpisah.</div>
  <div id="pages"></div>
  <div class="measure" id="measure" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="assets/print.js"></script>
</body>
</html>
